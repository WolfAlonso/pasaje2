<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasaje Delivery · Repartidores</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=4"></script>
  <script src="../js/theme-loader.js?v=4"></script>
  <script src="../js/dashboard-utils.js?v=4"></script>
  <script src="../js/dashboard-sidebar.js?v=6"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <div id="dashboardHeader"></div>

  <main class="max-w-6xl mx-auto p-4 pb-16 space-y-6">
    <div id="dashboardTabs"></div>

    <div id="loadingState" class="bg-white rounded-2xl p-8 text-center text-sm text-slate-500 shadow-sm">
      Cargando panel de repartidor...
    </div>

    <section id="content" class="hidden space-y-6">

      <!-- CARRERA EN CURSO -->
      <div id="activeDeliverySection" class="hidden space-y-3 bg-emerald-50/50 p-4 rounded-3xl border-2 border-emerald-500">
        <h2 class="font-black text-emerald-950 text-sm">⚡ Carrera Activa</h2>
        <div id="activeCard" class="bg-white p-3 rounded-2xl border text-xs space-y-2"></div>

        <!-- CHAT CON COMERCIO -->
        <div class="bg-white p-3 rounded-2xl border space-y-2">
          <h3 class="font-bold text-xs">💬 Chat con la Tienda</h3>
          <div id="driverChatMessages" class="h-32 overflow-y-auto p-2 bg-slate-50 border rounded-xl text-xs space-y-2"></div>
          <form id="driverChatForm" class="flex gap-2">
            <input type="text" id="driverChatMessageInput" required placeholder="Escribe un mensaje..." class="flex-1 border px-3 py-1.5 rounded-xl text-xs outline-none" />
            <button type="submit" class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs">Enviar</button>
          </form>
        </div>
      </div>

      <!-- PESTAÑAS FEED VS HISTORIAL -->
      <div class="bg-white p-1.5 rounded-2xl border grid grid-cols-2 gap-2 text-xs font-bold">
        <button type="button" id="tabFeed" class="py-2 rounded-xl bg-slate-900 text-white">📢 Feed de Carreras</button>
        <button type="button" id="tabHistory" class="py-2 rounded-xl bg-slate-100 text-slate-600">📜 Mi Historial</button>
      </div>

      <div id="feedSection" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      <div id="historySection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    </section>
  </main>

  <script>
    let currentUser = null, currentDriver = null, requests = [], activeReq = null, chatSub = null;

    (async () => {
      try {
        const session = await requireAuth();
        if (!session) return;
        currentUser = session.user;

        await initDashboardNav({ user: currentUser });
        await loadDriver();
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

        setupTabs();
        setupChat();
        await fetchAll();
        listenGlobal();
      } catch (e) { console.error(e); }
    })();

    async function loadDriver() {
      const client = window._supabase || initSupabaseClient();
      let { data } = await client.from('delivery_drivers').select('*').eq('user_id', currentUser.id).maybeSingle();
      if (!data) {
        const { data: newD } = await client.from('delivery_drivers').upsert([{ user_id: currentUser.id, is_available: true, full_name: currentUser.email }]).select().single();
        data = newD;
      }
      currentDriver = data;
    }

    function setupTabs() {
      const f = document.getElementById('feedSection'), h = document.getElementById('historySection');
      const bF = document.getElementById('tabFeed'), bH = document.getElementById('tabHistory');

      bF.onclick = () => { f.classList.remove('hidden'); h.classList.add('hidden'); bF.className = 'py-2 rounded-xl bg-slate-900 text-white'; bH.className = 'py-2 rounded-xl bg-slate-100 text-slate-600'; };
      bH.onclick = () => { h.classList.remove('hidden'); f.classList.add('hidden'); bH.className = 'py-2 rounded-xl bg-slate-900 text-white'; bF.className = 'py-2 rounded-xl bg-slate-100 text-slate-600'; };
    }

    async function fetchAll() {
      const client = window._supabase || initSupabaseClient();
      const { data } = await client.from('delivery_requests').select('*').order('created_at', { ascending: false });
      
      const rawRequests = data || [];
      const storeIds = [...new Set(rawRequests.map(r => r.store_id).filter(Boolean))];
      let storesMap = {};
      if (storeIds.length > 0) {
        const { data: storesData } = await client.from('stores').select('id, name').in('id', storeIds);
        (storesData || []).forEach(s => { storesMap[s.id] = s.name; });
      }

      requests = rawRequests.map(r => ({
        ...r,
        store: { name: storesMap[r.store_id] || 'Comercio' }
      }));

      activeReq = requests.find(r => String(r.driver_id) === String(currentDriver?.id) && ['accepted', 'on_the_way', 'counter_offered'].includes(r.status));
      renderActive();
      renderFeed();
      renderHistory();
    }

    function renderActive() {
      const sec = document.getElementById('activeDeliverySection');
      const card = document.getElementById('activeCard');
      if (!activeReq) { sec.classList.add('hidden'); return; }

      sec.classList.remove('hidden');
      card.innerHTML = `
        <div class="flex justify-between items-start">
          <div>
            <p class="font-bold text-slate-900">${dashEscapeHtml(activeReq.store?.name || 'Comercio')}</p>
            <p class="text-slate-600">📍 Origen: ${dashEscapeHtml(activeReq.origin_address || 'Tienda')}</p>
            <p class="text-slate-600">📍 Destino: ${dashEscapeHtml(activeReq.destination_address || 'Cliente')}</p>
          </div>
          <span class="font-black text-emerald-600 text-sm">Q${parseFloat(activeReq.final_fee || activeReq.suggested_fee || 15).toFixed(2)}</span>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="updateSt('delivered')" class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex-1">🟢 Finalizar Entrega</button>
        </div>
      `;

      fetchDriverChat(activeReq.id);
      subscribeDriverChat(activeReq.id);
    }

    function renderFeed() {
      const container = document.getElementById('feedSection');
      const driverId = currentDriver?.id;

      const pendings = requests.filter(r => {
        if (r.status !== 'pending') return false;
        const rejected = Array.isArray(r.rejected_driver_ids) ? r.rejected_driver_ids : [];
        if (driverId && rejected.includes(driverId)) return false;
        if (r.assignment_type === 'direct') return String(r.target_driver_id) === String(driverId);
        return true;
      });

      if (pendings.length === 0) {
        container.innerHTML = `<div class="col-span-full bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border">Sin solicitudes pendientes en el feed.</div>`;
        return;
      }

      container.innerHTML = pendings.map(r => `
        <article class="bg-white p-4 rounded-2xl border space-y-2 shadow-sm">
          <div class="flex justify-between items-start border-b pb-2">
            <div>
              <p class="font-bold text-xs text-emerald-700">🏪 ${dashEscapeHtml(r.store?.name || 'Comercio')}</p>
              <p class="text-xs text-slate-700">📍 Destino: ${dashEscapeHtml(r.destination_address || 'Cliente')}</p>
            </div>
            <span class="text-xs font-black bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded-lg">Q${parseFloat(r.suggested_fee || 15).toFixed(2)}</span>
          </div>
          <div class="flex gap-2 pt-1">
            <input type="number" step="0.50" id="fee_${r.id}" value="${r.suggested_fee || 15}" class="w-20 border px-2 py-1 text-xs rounded-xl font-bold" />
            <button type="button" onclick="acceptFee('${r.id}')" class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex-1">Aceptar</button>
            <button type="button" onclick="counterFee('${r.id}')" class="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs">Contraoferta</button>
          </div>
        </article>
      `).join('');
    }

    function renderHistory() {
      const container = document.getElementById('historySection');
      const history = requests.filter(r => String(r.driver_id) === String(currentDriver?.id) && ['delivered', 'completed'].includes(r.status));

      if (history.length === 0) {
        container.innerHTML = `<div class="col-span-full bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border">Sin entregas en el historial.</div>`;
        return;
      }

      container.innerHTML = history.map(r => `
        <article class="bg-white p-3 rounded-2xl border text-xs flex justify-between items-center">
          <div>
            <p class="font-bold text-slate-800">📍 ${dashEscapeHtml(r.destination_address || 'Destino')}</p>
            <p class="text-[10px] text-slate-500">${dashEscapeHtml(r.store?.name || 'Comercio')}</p>
          </div>
          <span class="text-emerald-600 font-black text-sm">Q${parseFloat(r.final_fee || r.suggested_fee || 0).toFixed(2)}</span>
        </article>
      `).join('');
    }

    async function acceptFee(id) {
      const fee = parseFloat(document.getElementById(`fee_${id}`).value) || 15;
      const client = window._supabase || initSupabaseClient();
      await client.from('delivery_requests').update({ driver_id: currentDriver.id, final_fee: fee, status: 'accepted', updated_at: new Date().toISOString() }).eq('id', id);
      await fetchAll();
    }

    async function counterFee(id) {
      const fee = parseFloat(document.getElementById(`fee_${id}`).value) || 15;
      const client = window._supabase || initSupabaseClient();
      await client.from('delivery_requests').update({ driver_id: currentDriver.id, counter_fee: fee, status: 'counter_offered', updated_at: new Date().toISOString() }).eq('id', id);
      await fetchAll();
    }

    async function updateSt(st) {
      const client = window._supabase || initSupabaseClient();
      await client.from('delivery_requests').update({ status: st, updated_at: new Date().toISOString() }).eq('id', activeReq.id);
      if (st === 'delivered' && activeReq.order_id) {
        await client.from('cart_orders').update({ status: 'completed' }).eq('id', activeReq.order_id);
      }
      await fetchAll();
    }

    function setupChat() {
      document.getElementById('driverChatForm').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('driverChatMessageInput');
        const msg = input.value.trim();
        if (!msg || !activeReq) return;

        input.value = '';
        const client = window._supabase || initSupabaseClient();
        await client.from('delivery_messages').insert([{
          request_id: activeReq.id,
          sender_id: currentUser.id,
          sender_role: 'driver',
          sender_name: currentDriver.full_name || 'Piloto',
          message: msg
        }]);
        fetchDriverChat(activeReq.id);
      };
    }

    async function fetchDriverChat(reqId) {
      const client = window._supabase || initSupabaseClient();
      const container = document.getElementById('driverChatMessages');
      const { data } = await client.from('delivery_messages').select('*').eq('request_id', reqId).order('created_at', { ascending: true });

      container.innerHTML = (data || []).map(m => `
        <div class="flex flex-col ${m.sender_role === 'driver' ? 'items-end' : 'items-start'}">
          <div class="${m.sender_role === 'driver' ? 'bg-emerald-600 text-white' : 'bg-white border text-slate-800'} px-2.5 py-1 rounded-xl">
            ${dashEscapeHtml(m.message)}
          </div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    function subscribeDriverChat(reqId) {
      const client = window._supabase || initSupabaseClient();
      if (chatSub) client.removeChannel(chatSub);
      chatSub = client.channel(`chat_driver_${reqId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'delivery_messages', filter: `request_id=eq.${reqId}` }, () => fetchDriverChat(reqId))
        .subscribe();
    }

    function listenGlobal() {
      const client = window._supabase || initSupabaseClient();
      client.channel('driver_global_sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'delivery_requests' }, () => fetchAll())
        .subscribe();
    }
  </script>
</body>
</html>
