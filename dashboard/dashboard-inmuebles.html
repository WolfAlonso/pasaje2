<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Inmuebles · Dashboard</title>
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=4"></script>
  <script src="../js/theme-loader.js?v=9"></script>
  <script src="../js/dashboard-sidebar.js?v=3"></script>
  <script src="../js/liquid-glass.js?v=4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .glass-container {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <div id="dashboardHeader"></div>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 pb-16 space-y-6">

    <!-- RESUMEN / KPIS -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="glass-container rounded-2xl p-4 shadow-sm border border-indigo-200/80 bg-indigo-50/20">
        <p class="text-[11px] font-bold text-indigo-700 uppercase tracking-wider">🏠 Total Inmuebles Activos</p>
        <p id="kpiTotal" class="text-3xl font-black text-indigo-900 mt-1">0</p>
      </div>

      <div class="glass-container rounded-2xl p-4 shadow-sm border border-blue-200/80 bg-blue-50/20">
        <p class="text-[11px] font-bold text-blue-700 uppercase tracking-wider">🔑 En Alquiler</p>
        <p id="kpiRent" class="text-3xl font-black text-blue-900 mt-1">0</p>
      </div>

      <div class="glass-container rounded-2xl p-4 shadow-sm border border-emerald-200/80 bg-emerald-50/20">
        <p class="text-[11px] font-bold text-emerald-700 uppercase tracking-wider">🏷️ En Venta</p>
        <p id="kpiSale" class="text-3xl font-black text-emerald-900 mt-1">0</p>
      </div>
    </div>

    <!-- BARRA DE ACCIÓN -->
    <div class="glass-container rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
      <div>
        <h2 class="text-lg font-black text-slate-900">Mis Inmuebles y Propiedades</h2>
        <p class="text-xs text-slate-500 font-medium">Publica y administra tus propiedades disponibles en Quetzaltenango.</p>
      </div>

      <button id="btnOpenModal" type="button" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl transition shadow flex items-center justify-center gap-2">
        <span>➕</span>
        <span>Publicar Nuevo Inmueble</span>
      </button>
    </div>

    <!-- LISTA TABULAR DE INMUEBLES -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
      <div id="myListingsContainer" class="divide-y divide-slate-100">
        <p class="p-8 text-center text-xs text-slate-500">Cargando tus propiedades...</p>
      </div>
    </div>

  </main>

  <!-- MODAL DE CREACIÓN / EDICIÓN -->
  <div id="listingModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[92vh] overflow-y-auto border border-slate-100 p-5 sm:p-6">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        <h3 id="modalFormTitle" class="text-lg font-black text-slate-900">🏠 Publicar Nuevo Inmueble</h3>
        <button id="btnCloseModal" type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-700 w-8 h-8 rounded-full font-bold text-xs flex items-center justify-center transition">✕</button>
      </div>

      <form id="listingForm" class="space-y-4">
        <input type="hidden" id="listingId" value="">

        <div>
          <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Título de la Propiedad *</label>
          <input type="text" id="inputTitle" required placeholder="Ej. Apartamento amueblado de 2 habitaciones en Zona 3"
            class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Modalidad *</label>
            <select id="selectTransaction" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="rent">Alquiler</option>
              <option value="sale">Venta</option>
              <option value="usufruct">Usufructo</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Categoría *</label>
            <select id="selectPropertyType" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="casa">Casa</option>
              <option value="apartamento">Apartamento</option>
              <option value="habitacion">Habitación Estudiantil</option>
              <option value="local">Local Comercial</option>
              <option value="terreno">Terreno</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Precio (Q) *</label>
            <input type="number" id="inputPrice" required step="0.01" min="0" placeholder="Ej. 3500"
              class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Zona de Xela *</label>
            <select id="selectZone" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Zona 1">Zona 1</option>
              <option value="Zona 2">Zona 2</option>
              <option value="Zona 3">Zona 3</option>
              <option value="Zona 4">Zona 4</option>
              <option value="Zona 5">Zona 5</option>
              <option value="Zona 6">Zona 6</option>
              <option value="Zona 7">Zona 7</option>
              <option value="Zona 8">Zona 8</option>
              <option value="Zona 9">Zona 9</option>
              <option value="Zona 10">Zona 10</option>
              <option value="Zona 11">Zona 11</option>
              <option value="Salcajá">Salcajá</option>
              <option value="La Esperanza">La Esperanza</option>
              <option value="San Mateo">San Mateo</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Dirección / Referencia</label>
            <input type="text" id="inputAddress" placeholder="Ej. 4a Calle y 12 Avenida"
              class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <!-- CARACTERÍSTICAS TÉCNICAS -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-100">
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">🛏️ Habitaciones</label>
            <input type="number" id="inputBedrooms" min="0" value="1" class="w-full border border-slate-200 p-2 rounded-lg text-xs font-semibold bg-white text-center">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">🚿 Baños</label>
            <input type="number" id="inputBathrooms" min="0" value="1" class="w-full border border-slate-200 p-2 rounded-lg text-xs font-semibold bg-white text-center">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">🚗 Parqueos</label>
            <input type="number" id="inputParking" min="0" value="1" class="w-full border border-slate-200 p-2 rounded-lg text-xs font-semibold bg-white text-center">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">📐 Área m²</label>
            <input type="number" id="inputArea" min="0" value="80" class="w-full border border-slate-200 p-2 rounded-lg text-xs font-semibold bg-white text-center">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-700 mb-1">💬 Teléfono WhatsApp de Contacto</label>
          <input type="tel" id="inputWhatsapp" placeholder="Ej. 50255551234"
            class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Descripción Detallada</label>
          <textarea id="inputDescription" rows="3" placeholder="Servicios incluidos, agua, luz, acceso a transporte..."
            class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-medium bg-white outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <!-- CARGA MULTI-IMAGEN -->
        <div class="bg-indigo-50/60 p-3.5 rounded-2xl border border-indigo-100 space-y-2">
          <label class="block text-xs font-black uppercase text-indigo-900">📷 Fotografía del Inmueble (Multi-imagen)</label>
          <input type="file" id="imageFilesInput" multiple accept="image/*" class="w-full text-xs text-slate-600 font-semibold file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
          
          <div id="imagePreviewsTrack" class="flex gap-2 overflow-x-auto pt-2"></div>
        </div>

        <!-- SWITCHES DISPONIBLE Y DESTACADO -->
        <div class="flex items-center justify-between gap-4 pt-2">
          <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
            <input type="checkbox" id="checkIsActive" checked class="w-4 h-4 accent-indigo-600 rounded">
            <span>Disponible / Publicado</span>
          </label>

          <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
            <input type="checkbox" id="checkIsFeatured" class="w-4 h-4 accent-amber-500 rounded">
            <span>Destacar Propiedad</span>
          </label>
        </div>

        <div class="flex gap-2 pt-3 border-t border-slate-100">
          <button type="button" id="btnCancelModal" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition">Cancelar</button>
          <button type="submit" id="btnSaveListing" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-2.5 rounded-xl text-xs transition shadow">Guardar Propiedad</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;
    let myProperties = [];
    let uploadedImageUrls = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const session = await requireAuth();
      if (!session) return;
      currentUser = session.user;

      await initDashboardNav({ user: currentUser });
      await loadMyListings();

      document.getElementById('btnOpenModal').addEventListener('click', () => openModal(null));
      document.getElementById('btnCloseModal').addEventListener('click', closeModal);
      document.getElementById('btnCancelModal').addEventListener('click', closeModal);

      document.getElementById('imageFilesInput').addEventListener('change', handleFilesUpload);
      document.getElementById('listingForm').addEventListener('submit', handleFormSubmit);
    });

    async function loadMyListings() {
      const container = document.getElementById('myListingsContainer');
      try {
        const { data, error } = await _supabase
          .from('real_estate_listings')
          .select('*')
          .eq('user_id', currentUser.id)
          .order('created_at', { ascending: false });

        if (error) throw error;
        myProperties = data || [];

        updateKPIs();
        renderTable();
      } catch (err) {
        container.innerHTML = `<p class="p-6 text-center text-xs text-rose-500 font-bold">Error al cargar listado: ${err.message}</p>`;
      }
    }

    function updateKPIs() {
      document.getElementById('kpiTotal').textContent = myProperties.filter(p => p.is_active).length;
      document.getElementById('kpiRent').textContent  = myProperties.filter(p => p.transaction_type === 'rent' && p.is_active).length;
      document.getElementById('kpiSale').textContent  = myProperties.filter(p => p.transaction_type === 'sale' && p.is_active).length;
    }

    function renderTable() {
      const container = document.getElementById('myListingsContainer');
      if (myProperties.length === 0) {
        container.innerHTML = `<p class="p-8 text-center text-xs text-slate-500 font-medium">No has publicado ninguna propiedad aún. Haz clic en "+ Publicar Nuevo Inmueble".</p>`;
        return;
      }

      container.innerHTML = myProperties.map(p => {
        const images = Array.isArray(p.image_urls) && p.image_urls.length > 0 ? p.image_urls : [window.PLACEHOLDER_IMG];
        const formattedPrice = new Intl.NumberFormat('es-GT', { style: 'currency', currency: 'GTQ' }).format(p.price || 0);

        return `
          <div class="p-4 flex items-center justify-between gap-4 hover:bg-slate-50/80 transition flex-wrap sm:flex-nowrap">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${images[0]}" class="w-16 h-16 rounded-xl object-cover bg-slate-100 flex-shrink-0 border border-slate-200">
              
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <h4 class="font-extrabold text-slate-900 text-sm truncate">${escapeHtml(p.title)}</h4>
                  <span class="text-[10px] ${p.is_active ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'} font-bold px-2 py-0.5 rounded-full">
                    ${p.is_active ? 'Activo' : 'Oculto'}
                  </span>
                  ${p.is_featured ? '<span class="text-[10px] bg-amber-100 text-amber-800 font-black px-2 py-0.5 rounded-full">⭐ Destacado</span>' : ''}
                </div>

                <p class="text-xs font-bold text-indigo-700 mt-0.5">${formattedPrice} · <span class="text-slate-500 uppercase font-medium">${p.transaction_type} (${p.property_type})</span></p>
                <p class="text-[11px] text-slate-400 mt-0.5">📍 ${escapeHtml(p.zone)} · 🛏️ ${p.bedrooms} hab · 🚿 ${p.bathrooms} baños</p>
              </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="openModal('${p.id}')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-3 py-1.5 rounded-xl transition">✏️ Editar</button>
              <button onclick="toggleActive('${p.id}', ${!p.is_active})" class="text-xs ${p.is_active ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'} font-bold px-3 py-1.5 rounded-xl transition">
                ${p.is_active ? '⏸️ Pausar' : '▶️ Activar'}
              </button>
              <button onclick="deleteListing('${p.id}')" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded-xl transition">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(id) {
      const modal = document.getElementById('listingModal');
      const form = document.getElementById('listingForm');
      form.reset();
      uploadedImageUrls = [];

      if (id) {
        const item = myProperties.find(x => String(x.id) === String(id));
        if (item) {
          document.getElementById('modalFormTitle').textContent = '✏️ Editar Inmueble';
          document.getElementById('listingId').value = item.id;
          document.getElementById('inputTitle').value = item.title || '';
          document.getElementById('selectTransaction').value = item.transaction_type || 'rent';
          document.getElementById('selectPropertyType').value = item.property_type || 'casa';
          document.getElementById('inputPrice').value = item.price || '';
          document.getElementById('selectZone').value = item.zone || 'Zona 1';
          document.getElementById('inputAddress').value = item.address || '';
          document.getElementById('inputBedrooms').value = item.bedrooms ?? 1;
          document.getElementById('inputBathrooms').value = item.bathrooms ?? 1;
          document.getElementById('inputParking').value = item.parking_spaces ?? 1;
          document.getElementById('inputArea').value = item.area_sqm ?? 80;
          document.getElementById('inputWhatsapp').value = item.contact_whatsapp || '';
          document.getElementById('inputDescription').value = item.description || '';
          document.getElementById('checkIsActive').checked = item.is_active !== false;
          document.getElementById('checkIsFeatured').checked = !!item.is_featured;

          uploadedImageUrls = Array.isArray(item.image_urls) ? [...item.image_urls] : [];
        }
      } else {
        document.getElementById('modalFormTitle').textContent = '🏠 Publicar Nuevo Inmueble';
        document.getElementById('listingId').value = '';
      }

      renderImagePreviews();
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('listingModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    async function handleFilesUpload(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      for (const file of files) {
        try {
          const url = await uploadImage(file, 'products', currentUser.id);
          if (url) uploadedImageUrls.push(url);
        } catch (err) {
          alert('Error al subir imagen: ' + err.message);
        }
      }
      renderImagePreviews();
    }

    function renderImagePreviews() {
      const track = document.getElementById('imagePreviewsTrack');
      track.innerHTML = uploadedImageUrls.map((url, idx) => `
        <div class="relative w-16 h-16 rounded-xl overflow-hidden bg-slate-200 flex-shrink-0 border border-slate-300">
          <img src="${url}" class="w-full h-full object-cover">
          <button type="button" onclick="removeImage(${idx})" class="absolute top-0.5 right-0.5 bg-rose-600 text-white w-4 h-4 rounded-full text-[10px] font-bold flex items-center justify-center">✕</button>
        </div>
      `).join('');
    }

    function removeImage(idx) {
      uploadedImageUrls.splice(idx, 1);
      renderImagePreviews();
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('btnSaveListing');
      saveBtn.disabled = true; saveBtn.textContent = 'Guardando...';

      try {
        const id = document.getElementById('listingId').value;
        const payload = {
          user_id: currentUser.id,
          title: document.getElementById('inputTitle').value.trim(),
          transaction_type: document.getElementById('selectTransaction').value,
          property_type: document.getElementById('selectPropertyType').value,
          price: parseFloat(document.getElementById('inputPrice').value) || 0,
          zone: document.getElementById('selectZone').value,
          address: document.getElementById('inputAddress').value.trim(),
          bedrooms: parseInt(document.getElementById('inputBedrooms').value) || 0,
          bathrooms: parseInt(document.getElementById('inputBathrooms').value) || 0,
          parking_spaces: parseInt(document.getElementById('inputParking').value) || 0,
          area_sqm: parseFloat(document.getElementById('inputArea').value) || 0,
          contact_whatsapp: document.getElementById('inputWhatsapp').value.trim(),
          description: document.getElementById('inputDescription').value.trim(),
          image_urls: uploadedImageUrls,
          is_active: document.getElementById('checkIsActive').checked,
          is_featured: document.getElementById('checkIsFeatured').checked
        };

        let error;
        if (id) {
          const res = await _supabase.from('real_estate_listings').update(payload).eq('id', id);
          error = res.error;
        } else {
          const res = await _supabase.from('real_estate_listings').insert([payload]);
          error = res.error;
        }

        if (error) throw error;

        closeModal();
        await loadMyListings();
      } catch (err) {
        alert('Error al guardar: ' + err.message);
      } finally {
        saveBtn.disabled = false; saveBtn.textContent = 'Guardar Propiedad';
      }
    }

    async function toggleActive(id, newState) {
      const { error } = await _supabase.from('real_estate_listings').update({ is_active: newState }).eq('id', id);
      if (error) alert('Error: ' + error.message);
      else await loadMyListings();
    }

    async function deleteListing(id) {
      if (!confirm('¿Estás seguro de eliminar esta propiedad?')) return;
      const { error } = await _supabase.from('real_estate_listings').delete().eq('id', id);
      if (error) alert('Error al eliminar: ' + error.message);
      else await loadMyListings();
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
