<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos · Mi Panel</title>
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=4"></script>
  <script src="../js/theme-loader.js?v=3"></script>
  <script src="../js/dashboard-utils.js?v=4"></script>
  <script src="../js/dashboard-sidebar.js?v=3"></script>
  <script src="../js/liquid-glass.js?v=1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    .kanban-col { transition: background .15s ease; }
    .kanban-col.drag-over { background: rgba(16,185,129,.06); box-shadow: inset 0 0 0 2px rgba(16,185,129,.4); }
    .order-card { transition: transform .15s ease; cursor: grab; }
    .order-card:hover { transform: translateY(-2px); shadow: 0 6px 20px -6px rgba(15,23,42,.15); }
    .col-scroll { max-height: calc(100vh - 340px); overflow-y: auto; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <div id="dashboardHeader"></div>

  <main class="max-w-7xl mx-auto p-4 pb-16">
    <div id="dashboardTabs"></div>

    <div id="loadingState" class="bg-white/85 backdrop-blur rounded-2xl p-8 text-center text-sm text-gray-500">Cargando pedidos…</div>

    <section id="content" class="hidden space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-extrabold text-gray-900">🛒 Pipeline de pedidos</h1>
          <p class="text-xs text-gray-500">Gestiona estados de venta y enlace de rastreo en vivo</p>
        </div>
        <button type="button" id="refreshBtn" class="text-xs bg-white border px-3.5 py-2 rounded-xl font-bold shadow-sm">⟳ Refrescar</button>
      </div>

      <!-- KANBAN DE ESTADOS (4 PASOS DE RASTREO) -->
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3">

        <div class="kanban-col bg-amber-50/60 rounded-2xl border border-amber-200 p-3" data-status="pending">
          <div class="flex justify-between mb-3"><h2 class="text-xs font-extrabold text-amber-800 uppercase">🟡 Pendiente</h2><span data-col-count="pending" class="text-[11px] bg-amber-500 text-white px-2 py-0.5 rounded-full font-bold">0</span></div>
          <div class="col-scroll space-y-2" data-dropzone="pending"><p class="text-xs text-gray-400 italic text-center py-6">Sin pedidos</p></div>
        </div>

        <div class="kanban-col bg-orange-50/60 rounded-2xl border border-orange-200 p-3" data-status="preparing">
          <div class="flex justify-between mb-3"><h2 class="text-xs font-extrabold text-orange-800 uppercase">🟠 En Preparación</h2><span data-col-count="preparing" class="text-[11px] bg-orange-500 text-white px-2 py-0.5 rounded-full font-bold">0</span></div>
          <div class="col-scroll space-y-2" data-dropzone="preparing"><p class="text-xs text-gray-400 italic text-center py-6">Sin pedidos</p></div>
        </div>

        <div class="kanban-col bg-blue-50/60 rounded-2xl border border-blue-200 p-3" data-status="ready">
          <div class="flex justify-between mb-3"><h2 class="text-xs font-extrabold text-blue-800 uppercase">🔵 Listo / En Camino</h2><span data-col-count="ready" class="text-[11px] bg-blue-500 text-white px-2 py-0.5 rounded-full font-bold">0</span></div>
          <div class="col-scroll space-y-2" data-dropzone="ready"><p class="text-xs text-gray-400 italic text-center py-6">Sin pedidos</p></div>
        </div>

        <div class="kanban-col bg-emerald-50/60 rounded-2xl border border-emerald-200 p-3" data-status="delivered">
          <div class="flex justify-between mb-3"><h2 class="text-xs font-extrabold text-emerald-800 uppercase">🟢 Entregado</h2><span data-col-count="delivered" class="text-[11px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-bold">0</span></div>
          <div class="col-scroll space-y-2" data-dropzone="delivered"><p class="text-xs text-gray-400 italic text-center py-6">Sin pedidos</p></div>
        </div>

        <div class="kanban-col bg-gray-100 rounded-2xl border border-gray-300 p-3" data-status="cancelled">
          <div class="flex justify-between mb-3"><h2 class="text-xs font-extrabold text-gray-700 uppercase">🗑️ Cancelado</h2><span data-col-count="cancelled" class="text-[11px] bg-gray-500 text-white px-2 py-0.5 rounded-full font-bold">0</span></div>
          <div class="col-scroll space-y-2" data-dropzone="cancelled"><p class="text-xs text-gray-400 italic text-center py-6">Sin pedidos</p></div>
        </div>

      </div>
    </section>
  </main>

  <script>
    let currentStore = null;
    let allOrders = [];

    (async () => {
      const { session, store, stores } = await guardDashboardPage();
      if (!session || !store) return;
      currentStore = store;
      await initDashboardNav({ user: session.user, store, stores });

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      await loadOrders();
      document.getElementById('refreshBtn').onclick = loadOrders;

      document.querySelectorAll('[data-dropzone]').forEach(zone => {
        const col = zone.closest('[data-status]');
        zone.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        zone.addEventListener('drop', async (e) => {
          e.preventDefault(); col.classList.remove('drag-over');
          const orderId = e.dataTransfer.getData('text/plain');
          const newStatus = col.dataset.status;
          if (orderId && newStatus) await updateOrderStatus(orderId, newStatus);
        });
      });
    })();

    async function loadOrders() {
      const { data } = await _supabase.from('cart_orders').select('*').eq('store_id', currentStore.id).order('created_at', { ascending: false });
      allOrders = (data || []).map(o => ({
        ...o,
        items: Array.isArray(o.items) ? o.items : [],
        total: parseFloat(o.total) || 0,
        status: o.status === 'sent' ? 'pending' : (o.status === 'contacted' ? 'preparing' : (o.status === 'completed' ? 'delivered' : (o.status || 'pending')))
      }));
      renderKanban();
    }

    function renderKanban() {
      const groups = { pending: [], preparing: [], ready: [], delivered: [], cancelled: [] };
      allOrders.forEach(o => {
        const s = groups[o.status] ? o.status : 'pending';
        groups[s].push(o);
      });

      Object.keys(groups).forEach(status => {
        const zone = document.querySelector(`[data-dropzone="${status}"]`);
        const badge = document.querySelector(`[data-col-count="${status}"]`);
        const list = groups[status];
        if (badge) badge.textContent = list.length;

        if (list.length === 0) {
          zone.innerHTML = '<p class="text-xs text-gray-400 italic text-center py-6">Sin pedidos</p>';
          return;
        }

        zone.innerHTML = list.map(o => {
          const trackingUrl = `${window.location.origin}/rastreo.html?id=${o.id}`;
          const waMsg = `Hola *${o.customer_name || 'Cliente'}*, el estado de tu pedido en *Pasaje de los Altos* ha cambiado a: *${status.toUpperCase()}*. Puedes ver el seguimiento en vivo aquí:\n${trackingUrl}`;
          const waLink = `https://wa.me/${cleanPhone(o.customer_phone)}?text=${encodeURIComponent(waMsg)}`;

          return `
            <div class="order-card bg-white rounded-xl border p-3 shadow-sm space-y-2" draggable="true" data-order-id="${o.id}">
              <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold text-gray-400">#${String(o.id).slice(0, 6)}</span>
                <span class="text-xs font-extrabold text-emerald-600">Q ${o.total.toFixed(2)}</span>
              </div>
              <p class="text-xs font-bold text-gray-800 truncate">${dashEscapeHtml(o.customer_name || 'Anónimo')}</p>
              <p class="text-[11px] text-gray-500 truncate">📱 ${dashEscapeHtml(o.customer_phone || '—')}</p>
              
              <div class="pt-2 border-t flex items-center justify-between gap-1">
                <select data-id="${o.id}" class="status-select text-[11px] font-bold py-1 px-1.5 rounded border bg-gray-50 outline-none">
                  <option value="pending" ${o.status==='pending'?'selected':''}>🟡 Pendiente</option>
                  <option value="preparing" ${o.status==='preparing'?'selected':''}>🟠 Preparación</option>
                  <option value="ready" ${o.status==='ready'?'selected':''}>🔵 Listo</option>
                  <option value="delivered" ${o.status==='delivered'?'selected':''}>🟢 Entregado</option>
                  <option value="cancelled" ${o.status==='cancelled'?'selected':''}>🗑️ Cancelado</option>
                </select>
                <a href="${waLink}" target="_blank" class="bg-[#25D366] text-white text-[10px] font-bold px-2 py-1 rounded shadow" title="Notificar por WhatsApp">📱 Notificar</a>
              </div>
            </div>`;
        }).join('');

        zone.querySelectorAll('[data-order-id]').forEach(card => {
          card.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', card.dataset.orderId));
        });

        zone.querySelectorAll('.status-select').forEach(sel => {
          sel.onchange = async () => await updateOrderStatus(sel.dataset.id, sel.value);
        });
      });
    }

    async function updateOrderStatus(orderId, newStatus) {
      allOrders.find(x => String(x.id) === String(orderId)).status = newStatus;
      renderKanban();
      await _supabase.from('cart_orders').update({ status: newStatus }).eq('id', orderId);
    }
  </script>
</body>
</html>
