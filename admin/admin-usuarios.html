<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios · Admin</title>
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../img/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/theme-loader.js?v=2"></script>
  <script src="../js/admin-utils.js"></script>
  <script src="../js/admin-sidebar.js?v=1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div id="adminHeader"></div>

  <main class="max-w-7xl mx-auto p-4">
    <div id="adminTabs"></div>

    <div id="loadingState" class="bg-white rounded-xl shadow-sm border p-8 text-center text-sm text-gray-500">Cargando...</div>

    <section id="content" class="hidden space-y-4">

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-white rounded-xl shadow-sm border p-4">
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total usuarios</p>
          <p id="statTotal" class="text-2xl font-extrabold text-gray-800 mt-1">—</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-4">
          <p class="text-xs font-semibold text-purple-700 uppercase tracking-wider">🛡️ Admins</p>
          <p id="statAdmins" class="text-2xl font-extrabold text-purple-600 mt-1">—</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-4">
          <p class="text-xs font-semibold text-blue-700 uppercase tracking-wider">🏪 Con tienda</p>
          <p id="statWithStore" class="text-2xl font-extrabold text-blue-600 mt-1">—</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-4">
          <p class="text-xs font-semibold text-gray-700 uppercase tracking-wider">👤 Sin perfil</p>
          <p id="statNoProfile" class="text-2xl font-extrabold text-gray-600 mt-1">—</p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border p-4">
        <div class="flex flex-col sm:flex-row gap-2">
          <div class="relative flex-1">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input id="userSearch" type="text" placeholder="Buscar por email, nombre, teléfono o ID..."
              class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <select id="userFilter"
            class="border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white focus:ring-2 focus:ring-amber-500 outline-none">
            <option value="all">Todos</option>
            <option value="admins">🛡️ Solo admins</option>
            <option value="no-admin">👤 No admins</option>
            <option value="with-store">🏪 Con tienda</option>
            <option value="no-store">🚫 Sin tienda</option>
          </select>
        </div>
      </div>

      <div id="usersList" class="bg-white rounded-xl shadow-sm border overflow-hidden divide-y">
        <p class="p-8 text-center text-sm text-gray-500">Cargando usuarios...</p>
      </div>
    </section>
  </main>

  <div id="userModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[92vh] overflow-y-auto">
      <div id="userModalContent" class="p-6"></div>
    </div>
  </div>

  <script>
    let currentAdmin = null;
    let allUsers = [];
    let storeByUser = {};
    const modal = document.getElementById('userModal');

    (async () => {
      const session = await adminGuardPage();
      if (!session) return;
      currentAdmin = session.user;
      await initAdminNav({ user: session.user });

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      await Promise.all([loadStoresByUser(), loadUsers()]);

      document.getElementById('userSearch').addEventListener('input', renderUsers);
      document.getElementById('userFilter').addEventListener('change', renderUsers);
    })();

    async function loadStoresByUser() {
      const { data } = await _supabase.from('stores').select('id, user_id, name, slug, is_suspended');
      (data || []).forEach(s => { storeByUser[s.user_id] = s; });
    }

    async function loadUsers() {
      const container = document.getElementById('usersList');
      container.innerHTML = '<p class="p-8 text-center text-sm text-gray-500">Cargando usuarios...</p>';

      const { data, error } = await _supabase.rpc('admin_list_users');
      if (error) {
        container.innerHTML = `
          <div class="p-8 text-center">
            <p class="text-sm text-red-500">Error al cargar usuarios.</p>
            <p class="text-xs text-gray-500 mt-1">Ejecuta el SQL de <code>admin_list_users()</code> actualizado.</p>
          </div>`;
        console.error(error);
        return;
      }
      allUsers = data || [];
      updateStats();
      renderUsers();
    }

    function updateStats() {
      const total = allUsers.length;
      const admins = allUsers.filter(u => u.is_admin).length;
      const withStore = allUsers.filter(u => storeByUser[u.user_id]).length;
      const noProfile = allUsers.filter(u => !u.display_name && !u.phone && !u.notes).length;

      document.getElementById('statTotal').textContent     = total;
      document.getElementById('statAdmins').textContent    = admins;
      document.getElementById('statWithStore').textContent = withStore;
      document.getElementById('statNoProfile').textContent = noProfile;
    }

    function renderUsers() {
      const container = document.getElementById('usersList');
      const e = adminEscapeHtml;
      const term = document.getElementById('userSearch').value.toLowerCase().trim();
      const filter = document.getElementById('userFilter').value;

      const list = allUsers.filter(u => {
        if (filter === 'admins' && !u.is_admin) return false;
        if (filter === 'no-admin' && u.is_admin) return false;
        if (filter === 'with-store' && !storeByUser[u.user_id]) return false;
        if (filter === 'no-store' && storeByUser[u.user_id]) return false;

        if (!term) return true;
        const haystack = [
          u.email, u.user_id, u.display_name, u.phone, u.notes
        ].filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(term);
      });

      if (list.length === 0) {
        container.innerHTML = '<p class="p-8 text-center text-sm text-gray-500">Sin resultados.</p>';
        return;
      }

      container.innerHTML = list.map(u => {
        const isSelf = u.user_id === currentAdmin?.id;
        const store = storeByUser[u.user_id];
        const initial = (u.display_name || u.email || 'U').charAt(0).toUpperCase();

        return `
          <div class="p-4 hover:bg-gray-50">
            <div class="flex items-start gap-3 flex-wrap">
              <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 text-white flex items-center justify-center font-bold flex-shrink-0">
                ${initial}
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="font-bold text-gray-800 truncate">${e(u.display_name || '(Sin nombre)')}</h3>
                  ${u.is_admin
                    ? '<span class="text-[10px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded-full">🛡️ Admin</span>'
                    : '<span class="text-[10px] bg-gray-100 text-gray-600 font-bold px-2 py-0.5 rounded-full">👤 Usuario</span>'}
                  ${isSelf ? '<span class="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full">Tú</span>' : ''}
                  ${store
                    ? `<span class="text-[10px] ${store.is_suspended ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'} font-bold px-2 py-0.5 rounded-full">
                         🏪 ${e(store.name)}${store.is_suspended ? ' (suspendida)' : ''}
                       </span>`
                    : ''}
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-0.5 mt-1 text-xs text-gray-600">
                  <p class="truncate">📧 ${e(u.email || 'Sin email')}</p>
                  <p class="truncate">📱 ${e(u.phone || '—')}</p>
                  <p class="truncate font-mono text-[10px] text-gray-400">${e(u.user_id)}</p>
                </div>

                ${u.notes ? `<p class="text-[11px] text-amber-700 bg-amber-50 px-2 py-1 rounded mt-1.5 inline-block">📝 ${e(u.notes.slice(0, 100))}${u.notes.length > 100 ? '…' : ''}</p>` : ''}
              </div>

              <div class="flex gap-1 flex-wrap flex-shrink-0">
                <button data-user-edit="${u.user_id}"
                  class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1.5 rounded-lg transition">
                  ✏️ Editar
                </button>
                <button data-user-toggle="${u.user_id}" ${isSelf ? 'disabled' : ''}
                  class="text-xs font-semibold px-3 py-1.5 rounded-lg transition ${isSelf
                    ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                    : (u.is_admin
                        ? 'bg-red-50 hover:bg-red-100 text-red-600'
                        : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700')}">
                  ${u.is_admin ? 'Quitar admin' : 'Hacer admin'}
                </button>
              </div>
            </div>
          </div>`;
      }).join('');

      container.onclick = (ev) => {
        const editBtn = ev.target.closest('[data-user-edit]');
        if (editBtn) {
          ev.stopPropagation();
          openUserModal(editBtn.dataset.userEdit);
          return;
        }
        const toggleBtn = ev.target.closest('[data-user-toggle]');
        if (toggleBtn && !toggleBtn.disabled) {
          ev.stopPropagation();
          toggleUserAdmin(toggleBtn);
        }
      };
    }

    async function toggleUserAdmin(btn) {
      const userId = btn.dataset.userToggle;
      const user = allUsers.find(x => x.user_id === userId);
      if (!user) return;
      const newVal = !user.is_admin;
      if (newVal && !confirm(`¿Dar permisos de administrador a ${user.email}?`)) return;
      if (!newVal && !confirm(`¿Quitar permisos de administrador a ${user.email}?`)) return;

      btn.disabled = true;
      try {
        const { error } = await _supabase
          .from('user_roles')
          .update({ is_admin: newVal })
          .eq('user_id', userId);
        if (error) throw error;
        await loadUsers();
      } catch (err) {
        console.error(err);
        alert('Error: ' + (err.message || 'desconocido'));
        btn.disabled = false;
      }
    }

    // ---------------------------------------------------------
    // Modal de edición de usuario
    // ---------------------------------------------------------
    function openUserModal(userId) {
      const u = allUsers.find(x => x.user_id === userId);
      if (!u) return;
      const e = adminEscapeHtml;
      const store = storeByUser[u.user_id];

      document.getElementById('userModalContent').innerHTML = `
        <div class="flex items-start justify-between mb-4">
          <div class="min-w-0">
            <h3 class="text-lg font-extrabold text-gray-800">Editar usuario</h3>
            <p class="text-xs text-gray-500 mt-0.5 font-mono truncate">${e(u.user_id)}</p>
          </div>
          <button id="closeUserModalBtn"
            class="bg-gray-100 hover:bg-gray-200 text-gray-700 w-9 h-9 rounded-lg flex items-center justify-center transition flex-shrink-0">✕</button>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-700">Email (solo lectura)</label>
            <input type="text" value="${e(u.email || '')}" disabled
              class="w-full border border-gray-200 bg-gray-50 p-2 rounded-lg mt-1 text-sm text-gray-600">
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-700">Nombre para mostrar</label>
            <input type="text" id="editUserDisplayName" value="${e(u.display_name || '')}"
              placeholder="Ej. María López"
              class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-700">Teléfono</label>
            <input type="tel" id="editUserPhone" value="${e(u.phone || '')}" placeholder="Ej. 50255551234"
              class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-700">Notas privadas (solo admin)</label>
            <textarea id="editUserNotes" rows="3" placeholder="Anotaciones internas sobre este usuario..."
              class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm focus:ring-2 focus:ring-amber-500 outline-none">${e(u.notes || '')}</textarea>
          </div>

          ${store ? `
            <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3">
              <p class="text-[10px] font-bold text-emerald-800 uppercase tracking-wider mb-1">🏪 Tienda asociada</p>
              <p class="text-sm font-bold text-gray-800">${e(store.name)}</p>
              <a href="../tienda.html?slug=${encodeURIComponent(store.slug)}" target="_blank"
                 class="text-xs text-emerald-700 hover:underline">Ver tienda →</a>
            </div>` : ''}

          <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
            <p class="text-[10px] font-bold text-blue-800 uppercase tracking-wider mb-1">🛡️ Rol de administrador</p>
            <p class="text-xs text-blue-800 mb-2">Otorga o revoca el acceso al panel de administración.</p>
            <button id="toggleAdminFromModalBtn" ${u.user_id === currentAdmin?.id ? 'disabled' : ''}
              class="text-xs font-semibold px-3 py-2 rounded-lg transition ${u.user_id === currentAdmin?.id
                ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                : (u.is_admin
                    ? 'bg-red-50 hover:bg-red-100 text-red-600'
                    : 'bg-emerald-500 hover:bg-emerald-600 text-white')}">
              ${u.is_admin ? '🛡️ Quitar permisos de admin' : '🛡️ Otorgar permisos de admin'}
            </button>
          </div>
        </div>

        <div class="flex gap-2 pt-4 mt-4 border-t">
          <button id="cancelUserModalBtn"
            class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold text-sm px-5 py-2.5 rounded-lg transition">
            Cancelar
          </button>
          <button id="saveUserModalBtn"
            class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-6 py-2.5 rounded-lg transition disabled:opacity-60">
            Guardar cambios
          </button>
        </div>
      `;

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      const closeFn = () => {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
        document.getElementById('userModalContent').innerHTML = '';
      };

      document.getElementById('closeUserModalBtn').addEventListener('click', closeFn);
      document.getElementById('cancelUserModalBtn').addEventListener('click', closeFn);
      modal.addEventListener('click', (ev) => { if (ev.target === modal) closeFn(); }, { once: true });

      document.getElementById('saveUserModalBtn').addEventListener('click', async () => {
        const btn = document.getElementById('saveUserModalBtn');
        btn.disabled = true; btn.textContent = 'Guardando...';

        try {
          const display_name = document.getElementById('editUserDisplayName').value.trim() || null;
          const phone = document.getElementById('editUserPhone').value.trim() || null;
          const notes = document.getElementById('editUserNotes').value.trim() || null;

          const { data, error } = await _supabase
            .from('user_profiles')
            .upsert([{
              user_id: u.user_id,
              display_name,
              phone,
              notes,
              updated_at: new Date().toISOString(),
            }], { onConflict: 'user_id' })
            .select('user_id');

          if (error) throw error;
          if (!data || data.length === 0) {
            throw new Error('La operación no afectó ninguna fila (posible RLS). Ejecuta el SQL de user_profiles.');
          }

          btn.textContent = '✅ Guardado';
          setTimeout(() => { closeFn(); loadUsers(); }, 600);
        } catch (err) {
          console.error(err);
          alert('Error al guardar: ' + (err.message || 'desconocido'));
          btn.disabled = false; btn.textContent = 'Guardar cambios';
        }
      });

      const toggleBtn = document.getElementById('toggleAdminFromModalBtn');
      if (toggleBtn && !toggleBtn.disabled) {
        toggleBtn.addEventListener('click', async () => {
          const newVal = !u.is_admin;
          if (newVal && !confirm(`¿Dar permisos de administrador a ${u.email}?`)) return;
          if (!newVal && !confirm(`¿Quitar permisos de administrador a ${u.email}?`)) return;

          toggleBtn.disabled = true;
          try {
            const { error } = await _supabase
              .from('user_roles')
              .update({ is_admin: newVal })
              .eq('user_id', u.user_id);
            if (error) throw error;
            closeFn();
            await loadUsers();
          } catch (err) {
            console.error(err);
            alert('Error: ' + (err.message || 'desconocido'));
            toggleBtn.disabled = false;
          }
        });
      }
    }

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && !modal.classList.contains('hidden')) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
        document.getElementById('userModalContent').innerHTML = '';
      }
    });
  </script>
</body>
</html>
